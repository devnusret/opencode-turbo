name: build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Test
        run: cargo test --release

      - name: Add musl target
        run: rustup target add aarch64-unknown-linux-musl

      - name: Build static aarch64 binary
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: rust-lld
          RUSTFLAGS: -C target-feature=+crt-static
        run: |
          RUST_LLD="$(find "$(rustc --print sysroot)" -name rust-lld -type f | head -n 1)"
          mkdir -p "$HOME/.cargo/bin"
          ln -sf "$RUST_LLD" "$HOME/.cargo/bin/rust-lld"
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo build --release --target aarch64-unknown-linux-musl
          mkdir -p dist
          cp target/aarch64-unknown-linux-musl/release/opencode-turbo dist/opencode-turbo-aarch64-linux-musl
          (cd dist && sha256sum opencode-turbo-aarch64-linux-musl > SHA256SUMS.musl)
          file dist/opencode-turbo-aarch64-linux-musl

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: opencode-turbo-aarch64-linux-musl
          path: |
            dist/opencode-turbo-aarch64-linux-musl
            dist/SHA256SUMS.musl

      - name: Publish release assets
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "opencode-turbo $TAG" --generate-notes
          gh release upload "$TAG" \
            dist/opencode-turbo-aarch64-linux-musl \
            dist/SHA256SUMS.musl \
            --clobber
